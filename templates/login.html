{% from "_iconos.html" import icono %}
{% extends "layout.html" %}
{% block title %}Ingresar · Biblioteca{% endblock %}
{% block content %}
<div class="panel-acceso">
  <p class="antetitulo">Acceso</p>
  <h1>Ingresar</h1>
  <form method="post">
    <input type="hidden" name="csrf" value="{{ csrf_token }}">
    <label for="identificador">Código o correo</label>
    <input id="identificador" name="identificador" value="{{ identificador }}" required
           autocomplete="username" autofocus>
    <label for="contrasena">Contraseña</label>
    <input id="contrasena" name="contrasena" type="password" required autocomplete="current-password">
    <button class="btn btn-primario">Ingresar {{ icono('flecha') }}</button>
  </form>
  <p class="suave pequeno" style="margin-top: 1rem">¿No tienes cuenta?
    <a href="{{ url_for('auth.registro') }}">Regístrate como estudiante o docente</a>.</p>
</div>
{% endblock %}
